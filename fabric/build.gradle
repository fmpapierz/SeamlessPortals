            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -Pis5CrossingTrace=true
            if (project.findProperty('is5CrossingTrace') == 'true') { vmArg('-Dseamlessportals.is5CrossingTrace=true') }
            // IS5-XFLICK crossing wrong-dest flicker fix, DEFAULT ON; the disable row is the
            // on-command flicker reproduction (B direction) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableTeleportSpecSkip=true
            if (project.findProperty('disableTeleportSpecSkip') == 'true') { vmArg('-Dseamlessportals.disableTeleportSpecSkip=true') }
            // IS5-BLINK query hysteresis (the far-away one-frame window-dropout fix), DEFAULT ON;
            // disable = on-command dropout reproduction (the [IS5-BLINK] detector logs either way) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableQueryHysteresis=true
            if (project.findProperty('disableQueryHysteresis') == 'true') { vmArg('-Dseamlessportals.disableQueryHysteresis=true') }
            // IS5-ARRIVE sideways-arrival suspension withhold, DEFAULT ON; disable = shipped
            // round-2 behavior bit-identically (the one-frame sideways hole on command) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableSeamArrivalScope=true
            if (project.findProperty('disableSeamArrivalScope') == 'true') { vmArg('-Dseamlessportals.disableSeamArrivalScope=true') }
            // IS5-HIST prev-capture window history, DEFAULT ON; disable = the ugly MB-off
            // approach-blur reproduction (history=current) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableWindowHistoryPrev=true
            if (project.findProperty('disableWindowHistoryPrev') == 'true') { vmArg('-Dseamlessportals.disableWindowHistoryPrev=true') }
            // IS5-XDIM cross-dim dest-chain restore (nether storm in cross-dim windows), DEV
            // DEFAULT OFF — the first-leg lever (migration/IS5_XDIM_DESIGN.md kill-checks) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PcrossDimDestChain=true
            if (project.findProperty('crossDimDestChain') == 'true') { vmArg('-Dseamlessportals.crossDimDestChain=true') }
            // IS5-ACT dest-volume seeding GATE PROBE (2026-07-25) — LOG-ONLY, default OFF.
            // Legs [1]-[3] are pure reads (zero GL); leg [4] issues one 1Hz DSA readback +
            // memory barrier (a visible ~1Hz hitch — never leave it on for gameplay) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PactProbe=true -PactVolumeProbe=true
            if (project.findProperty('actProbe') == 'true') { vmArg('-Dseamlessportals.actProbe=true') }
            if (project.findProperty('actVolumeProbe') == 'true') { vmArg('-Dseamlessportals.actVolumeProbe=true') }
            // IS5-ACT ROUND-2 dispatch witness (log-only, default OFF; REQUIRES -PactProbe).
            // 2 log-only iris mixins (ComputeProgram.dispatch HEAD + ShadowCompositeRenderer
            // .renderAll HEAD) + GL uniform/image-binding queries, one capture per armed portal
            // window, folded into the existing 1Hz emit —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PactProbe=true -PactVolumeProbe=true -PactDispatchProbe=true
            if (project.findProperty('actDispatchProbe') == 'true') { vmArg('-Dseamlessportals.actDispatchProbe=true') }
            // TP-XDIM FRAME CENSUS (2026-07-28; log-only, DEFAULT OFF, never throws into the render
            // path). THE run block for this arc — the defect needs a real shaderpack. Classifies
            // every in-world frame by what renderCrossPortalView() did (11 codes) plus three
            // independently-woven witnesses of what actually ran (renderLevel / the IS0 anchor /
            // the AFTER_TRANSLUCENT_TERRAIN driver). One batched log call per ~1 s window, plus a
            // one-shot ARMED line, a one-shot TARGET ACQUIRED line, and a VOID-LEG watchdog —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PtpXdimCensus=true
            if (project.findProperty('tpXdimCensus') == 'true') { vmArg('-Dseamlessportals.tpXdimCensus=true') }
            // Opt-in GL add-on: TWO glIsEnabled state queries per frame at the census frame boundary
            // (stencil + scissor). No readbacks, no barriers, never inside a pass. Run it as its OWN
            // leg — do not mix it into a primary A/B —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PtpXdimCensus=true -PtpXdimCensusGl=true
            if (project.findProperty('tpXdimCensusGl') == 'true') { vmArg('-Dseamlessportals.tpXdimCensusGl=true') }
            // TP-XDIM CROSS-VIEW FULL-PIPELINE ROUTE — DEFAULT ON (2026-07-28). The measured
            // third-person + shaderpack whole-screen terrain explosion is the D23 decomposed driver
            // running as a FRAME-REPLACING render: no LevelRenderer.render => none of iris's
            // per-frame gbuffer setup, while its shader programs still substitute. The fix routes
            // that one layer-0 caller to the full-pipeline driver (IP's own architecture — IP's
            // cross-view frame ran a nested full renderLevel). Pass this to force the pre-fix route
            // and REPRODUCE the explosion — the A/B leg that proves the fix —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableCrossViewFullPipeline=true
            if (project.findProperty('disableCrossViewFullPipeline') == 'true') { vmArg('-Dseamlessportals.disableCrossViewFullPipeline=true') }
            // TP-XDIM ESCAPE HATCH (DEFAULT OFF): decline the cross-portal view while a shaderpack
            // is running — vanilla renderLevel renders the frame and the third-person camera clips
            // into the portal wall (IP's pre-cross-view behaviour: ugly, never corrupt). The
            // fallback if the route above proves unusable, and this arc's NEGATIVE discriminator
            // (explosion SURVIVES it => the cross-view path is not the carrier) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PcrossViewSuppressUnderPack=true
            if (project.findProperty('crossViewSuppressUnderPack') == 'true') { vmArg('-Dseamlessportals.crossViewSuppressUnderPack=true') }
