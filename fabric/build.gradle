plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    // Mod Menu (in-game config screen integration).
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
    // S19-E: real Sodium 0.9.1 + Iris 1.11.2 for MC 26.2 (see dependencies).
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // S19-E: real Cloth Config 26.2.155 (retires the F21 me.shedaniel.autoconfig
    // no-op). IP's own build.gradle:34 resolves cloth from this same maven.
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroupByRegex 'me\\.shedaniel.*'
        }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu: compiled against so the config screen is reachable from Mod
    // Menu's mod list. Declared with plain `implementation` to match this
    // project's fabric-api convention (no loom mod-remapping config in use).
    // NOT a hard runtime dependency (no "modmenu" entry in fabric.mod.json
    // depends) — the "modmenu" entrypoint is ignored when Mod Menu is absent.
    implementation "com.terraformersmc:modmenu:20.0.0-beta.4"

    // S19-E: real Cloth Config 26.2.155 on :fabric, replacing the retired F21
    // me.shedaniel.autoconfig functional no-op (common/src/main/java/me/shedaniel/**,
    // deleted this stage). `implementation` (NOT compileOnly): the config GUI
    // (IPConfigGUI.createClothConfigScreen → AutoConfig.getConfigScreen) is real
    // runtime code, and cloth-config is a real Fabric mod loom must LOAD into the dev
    // runtime for that screen to build. IP's own build.gradle:84-87 declares this as
    // modApi + `include` (JiJ). This repo ships no JiJ yet and is remap-free (26.2
    // unobfuscated) → plain `implementation` (same convention as fabric-api/modmenu),
    // no loom mod-remapping. TODO release packaging: bundle cloth (loom `include`/JiJ)
    // or declare a hard "cloth-config" dependency in fabric.mod.json so end users have
    // it at runtime. Excludes mirror IP build.gradle:85 (fabric-api) + drop cloth's
    // transitive fabric-loader 0.19.3 — this project pins both itself above. Kept:
    // me.shedaniel.cloth:basic-math + runtime jankson/toml4j/snakeyaml.
    implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: 'net.fabricmc.fabric-api')
        exclude(group: 'net.fabricmc', module: 'fabric-loader')
    }

    // S19-E: real Sodium 0.9.1 + Iris 1.11.2 on the :fabric compile classpath. The loader
    // recompiles :common's raw source, which now references the real sodium/iris types after
    // the F21 stub retirement, so these types must be visible here too. compileOnly ONLY —
    // the compat code is runtime-dead today (On*Present invokers unwired until C2), so neither
    // jar enters the shipped/runtime classpath by default. To actually LOAD them in a dev run,
    // opt in via the -PsodiumRuntime / -PirisRuntime properties handled below (used by the
    // runClientSodium run config). Empty POMs (no transitives). Remap-free build → plain
    // compileOnly, never modCompileOnly.
    compileOnly "maven.modrinth:sodium:${project.sodium_version}"
    compileOnly "maven.modrinth:iris:${project.iris_version}"

    // S19-E OPT-IN runtime scoping. By default sodium/iris are compile-only and never load;
    // pass a property to add them to the runtime for a live compat test:
    //   .\gradlew.bat :fabric:runClientSodium -PsodiumRuntime=true   (Sodium alone)
    //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true     (Iris + its required Sodium)
    // Iris's loader metadata requires sodium "0.9.x" at runtime (its fabric.mod.json depends);
    // both POMs are EMPTY so gradle pulls nothing transitively — the explicit second runtimeOnly
    // line below is what adds the matching sodium build. With no property set,
    // `:fabric:compileJava` resolves neither into any runtime configuration (the deps stay
    // compileOnly). Retired at C2 when the invokers are wired for real.
    if (project.hasProperty('sodiumRuntime')) {
        runtimeOnly "maven.modrinth:sodium:${project.sodium_version}"
    }
    if (project.hasProperty('irisRuntime')) {
        runtimeOnly "maven.modrinth:sodium:${project.sodium_version}"
        runtimeOnly "maven.modrinth:iris:${project.iris_version}"
    }
}

loom {
    def aw = project(':common').file('src/main/resources/seamlessportals.accesswidener')
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            runDir('runs/client')
            // S19 live-round crash (2026-07-18, hs_err_pid318288): EXCEPTION_ACCESS_VIOLATION
            // inside jvm.dll on "C2 CompilerThread2" while JIT-compiling
            // PortalRenderInfo::renderAndDecideVisibility — a Temurin 25.0.2 HotSpot C2
            // compiler defect (pure jvm.dll frames; not the render thread, not the driver,
            // not mod logic; fired ~when the method crossed the tier-4 threshold after a few
            // portal teleports). Surgical mitigation: exclude that ONE method from JIT
            // compilation (runs interpreted/C1 — negligible, it's a small dispatch method).
            // Re-test on future JDK updates; remove when a fixed Temurin lands.
            // (The crossing gametest run carries the same flag — same JVM, same hot method;
            // without it the suite gate could go flaky on the same defect.)
            vmArg('-XX:CompileCommand=exclude,qouteall.imm_ptl.core.portal.PortalRenderInfo::renderAndDecideVisibility')
            // IS0 probe-round crash (2026-07-20, hs_err_pid248404): the SAME Temurin 25.0.2
            // C2-CompilerThread jvm.dll EXCEPTION_ACCESS_VIOLATION class, new victim method
            // (CompileTask = vanilla IOWorker::storePendingChunk, during world save; crash on
            // CompilerThread0, not any game thread — not mod logic, not the IS0 probes). Same
            // surgical mitigation, same removal condition as the exclude above.
            vmArg('-XX:CompileCommand=exclude,net.minecraft.world.level.chunk.storage.IOWorker::storePendingChunk')
            // THIRD victim of the same Temurin 25.0.2 C2 defect (hs_err_pid962536, 2026-07-26 23:42):
            // EXCEPTION_ACCESS_VIOLATION reading 0x2c, Current thread = "C2 CompilerThread0", problematic
            // frame V [jvm.dll+0x73238f], Current CompileTask = GlQueryObject::performQuery. Pure
            // jvm.dll frames on the COMPILER thread with no game thread and no mod frame involved —
            // the established signature, and distinct from the IS0 native-heap-corruption class which
            // shows victim VARIETY rather than one method. Same surgical mitigation, same removal
            // condition: drop all three when a fixed Temurin lands.
            vmArg('-XX:CompileCommand=exclude,qouteall.imm_ptl.core.render.GlQueryObject::performQuery')
            // IS1 shaderpack-views renderer lever (IRIS_SHADERS_ON_DESIGN.md §1 IS1 deliverable
            // 5/6): arms the lever-only compat renderer for the plain proof rows —
            //   .\gradlew.bat :fabric:runClient -PshaderpackViews=true
            if (project.findProperty('shaderpackViews') == 'true') { vmArg('-Dseamlessportals.shaderpackViews=true') }
        }
        server {
            server()
            setConfigName('Fabric Server')
            runDir('runs/server')
        }
        // S19-E live Sodium/Iris compat run. Sodium/Iris are compileOnly by default (see the
        // dependencies block), so this run only actually LOADS them when the matching runtime
        // property is passed on the command line:
        //   .\gradlew.bat :fabric:runClientSodium -PsodiumRuntime=true   (Sodium alone)
        //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true     (Iris + required Sodium)
        // Without a property it launches identically to the plain client run (no compat mod on
        // the runtime). Carries the same Temurin 25.0.2 C2 JIT mitigation as the client run.
        clientSodium {
            client()
            setConfigName('Fabric Client + Sodium')
            runDir('runs/client-sodium')
            // Same Temurin 25.0.2 HotSpot C2 defect mitigation as the `client` run above
            // (EXCEPTION_ACCESS_VIOLATION JIT-compiling PortalRenderInfo::renderAndDecideVisibility).
            vmArg('-XX:CompileCommand=exclude,qouteall.imm_ptl.core.portal.PortalRenderInfo::renderAndDecideVisibility')
            // + the second victim method (IS0 probe round, hs_err_pid248404 — see the client run).
            vmArg('-XX:CompileCommand=exclude,net.minecraft.world.level.chunk.storage.IOWorker::storePendingChunk')
            // THIRD victim of the same Temurin 25.0.2 C2 defect (hs_err_pid962536, 2026-07-26 23:42):
            // EXCEPTION_ACCESS_VIOLATION reading 0x2c, Current thread = "C2 CompilerThread0", problematic
            // frame V [jvm.dll+0x73238f], Current CompileTask = GlQueryObject::performQuery. Pure
            // jvm.dll frames on the COMPILER thread with no game thread and no mod frame involved —
            // the established signature, and distinct from the IS0 native-heap-corruption class which
            // shows victim VARIETY rather than one method. Same surgical mitigation, same removal
            // condition: drop all three when a fixed Temurin lands.
            vmArg('-XX:CompileCommand=exclude,qouteall.imm_ptl.core.render.GlQueryObject::performQuery')
            // C2-0 compat probes (migration/C2_DESIGN.md §4): opt in to arm the lever-gated,
            // log-only Sodium diagnostics — .\gradlew.bat :fabric:runClientSodium -PsodiumRuntime=true -PcompatProbe=true
            if (project.findProperty('compatProbe') == 'true') { vmArg('-Dseamlessportals.compatProbe=true') }
            // C2-1 sodium activation lever (design §1 C2-1 deliverable 8): flips the SODIUM
            // per-mod verdict live for this run without touching the committed
            // ExperimentalCompatGate default —
            //   .\gradlew.bat :fabric:runClientSodium -PsodiumRuntime=true -PsodiumCompatLever=true
            if (project.findProperty('sodiumCompatLever') == 'true') { vmArg('-Dseamlessportals.experimentalSodiumCompat=true') }
            // IS0 shaderpack-views probe (migration/IRIS_SHADERS_ON_DESIGN.md §1 IS0 deliverable 3
            // as amended by port-note IS-iris-shaders-on.md §1.3): opt in to arm the one-shot,
            // log-only shaders-ON probe suite (P-alpha/gamma + P-B2 + P-OQ4) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PshaderpackViewsProbe=true
            if (project.findProperty('shaderpackViewsProbe') == 'true') { vmArg('-Dseamlessportals.shaderpackViewsProbe=true') }
            // IS1 shaderpack-views renderer lever (mirror of the client run's; the sodium/iris
            // proof + live rounds) —
            //   .\gradlew.bat :fabric:runClientSodium -PsodiumRuntime=true -PshaderpackViews=true
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PshaderpackViews=true
            if (project.findProperty('shaderpackViews') == 'true') { vmArg('-Dseamlessportals.shaderpackViews=true') }
            // IS3 clip discriminator probe (port-note IS-iris-shaders-on.md §4.7 discriminators
            // 1+2): 1Hz per-draw dump at the vanilla trySetup handler for the first N draws of a
            // full-pipeline pass (terrain->loc>=0/enabled, entity+sky->loc==-1/disabled) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PclipProbe=true
            if (project.findProperty('clipProbe') == 'true') { vmArg('-Dseamlessportals.clipProbe=true') }
            // IS5 shadow-emptiness probe (port-note IS-iris-shaders-on.md §5): 1Hz per-pass dump of
            // the OW-dest shadow state (pass-fired flags, the drawn counts + sodium shadow HUD text,
            // pipeline/dim/sun cross-check, and the decisive shadow-depth readback) — settles
            // whether the nested OW shadow map is EMPTY —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PshadowProbe=true
            if (project.findProperty('shadowProbe') == 'true') { vmArg('-Dseamlessportals.shadowProbe=true') }
            // C2-1 SAME-DIM FLASH FIX A/B (2026-07-21): the per-portal-layer MultiDrawBatch isolation
            // is DEFAULT-ON; pass this to force it OFF and reproduce the same-dim source-terrain vanish
            // (attribution proof) —
            //   .\gradlew.bat :fabric:runClientSodium -PsodiumRuntime=true -PdisablePortalBatchIsolation=true
            if (project.findProperty('disablePortalBatchIsolation') == 'true') { vmArg('-Dseamlessportals.disablePortalBatchIsolation=true') }
            // IS5-P phantom fix A/B (2026-07-22): the iris temporal-target guard is DEFAULT-ON; pass this to
            // force it OFF and reproduce the whole-screen phantom overlay (attribution proof) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableIrisTemporalGuard=true
            if (project.findProperty('disableIrisTemporalGuard') == 'true') { vmArg('-Dseamlessportals.disableIrisTemporalGuard=true') }
            // IS5-L in-portal-fullbright fix A/B (2026-07-22): the iris per-frame-uniform re-upload (counter
            // bump around the dest render) is DEFAULT-ON; pass this to force it OFF and reproduce the
            // direction-dependent fullbright (attribution proof) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableIrisPerFrameRefresh=true
            if (project.findProperty('disableIrisPerFrameRefresh') == 'true') { vmArg('-Dseamlessportals.disableIrisPerFrameRefresh=true') }
            // IS5-L in-portal-fullbright PROBE (migration/FULLBRIGHT_HANDOFF.md §5): DEFAULT-OFF,
            // log-only. Arms IrisFullbrightProbe — the main-vs-dest per-frame lighting-uniform compare
            // (cross-pass COUNTER + glGetUniformfv of gbufferModelView/celestial + the reflected
            // CapturedRenderingState source) that settles which of the §4 hypotheses the fullbright is —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PfullbrightProbe=true
            if (project.findProperty('fullbrightProbe') == 'true') { vmArg('-Dseamlessportals.fullbrightProbe=true') }
            // IS5-W shadow-alias probe (theory-restart wf_2d369c84-97c fold §3): DEFAULT-OFF,
            // log-only. Tests the adjudicated scope-collapse mechanism (the C2-1 per-layer batches
            // serving BOTH the dest shadow and dest camera scopes): batch fill provenance split by
            // scope, in-scope rosters, list identity collisions + woven-RSM snapshot state, and a
            // 12x12 whole-shadow-map occupancy grid logged WITH the player's yaw —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PshadowAliasProbe=true
            if (project.findProperty('shadowAliasProbe') == 'true') { vmArg('-Dseamlessportals.shadowAliasProbe=true') }
            // §2b dest-entity funnel probe (1Hz [ENT-PROBE] lines; default OFF):
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PentityProbe=true
            if (project.findProperty('entityProbe') == 'true') { vmArg('-Dseamlessportals.entityProbe=true') }
            // §2b compat same-dim entity fill A/B (2026-07-24): DEFAULT-ON; pass this to force it OFF and
            // reproduce the empty-window signature ([ENT-PROBE] fsd=0 sub=0) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableCompatSameDimEntities=true
            if (project.findProperty('disableCompatSameDimEntities') == 'true') { vmArg('-Dseamlessportals.disableCompatSameDimEntities=true') }
            // §2c source-particle cull A/B (2026-07-25): DEFAULT-ON; pass this to force it OFF and restore
            // the shaders-OFF+Fabulous behind-plane particle bleed over the window —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableSourceParticleCull=true
            if (project.findProperty('disableSourceParticleCull') == 'true') { vmArg('-Dseamlessportals.disableSourceParticleCull=true') }
            // IS-BOB iris bob-sync A/B (2026-07-25): DEFAULT-ON; pass to force OFF and restore the
            // shaders-ON relative bob (world bobs, window static) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableIrisBobSync=true
            if (project.findProperty('disableIrisBobSync') == 'true') { vmArg('-Dseamlessportals.disableIrisBobSync=true') }
            // IS-BOB 1Hz [BOB-SYNC] probe (default OFF):
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PbobSyncProbe=true
            if (project.findProperty('bobSyncProbe') == 'true') { vmArg('-Dseamlessportals.bobSyncProbe=true') }
            // §2g portal-ticket despawn suppress A/B (2026-07-25): DEFAULT-ON; pass to force OFF and
            // reproduce the same-dim portal mob-vanish (attribution proof) —
            //   .\gradlew.bat :fabric:runClientSodium -PdisableTicketDespawnSuppress=true
            if (project.findProperty('disableTicketDespawnSuppress') == 'true') { vmArg('-Dseamlessportals.disableTicketDespawnSuppress=true') }
            // IS5-FF A/B (§2h): disable the nested shadowcomp suppression (Ultra colored-light phantom returns) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableNestedShadowComposite=true
            if (project.findProperty('disableNestedShadowComposite') == 'true') { vmArg('-Dseamlessportals.disableNestedShadowComposite=true') }
            // IS5-FF 1Hz probe (default OFF):
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PnestedShadowCompositeProbe=true
            if (project.findProperty('nestedShadowCompositeProbe') == 'true') { vmArg('-Dseamlessportals.nestedShadowCompositeProbe=true') }
            // §2g Probe A despawn-removal logger (default OFF; server-side [DESPAWN-PROBE] lines) —
            //   .\gradlew.bat :fabric:runClientSodium -PdespawnProbe=true
            if (project.findProperty('despawnProbe') == 'true') { vmArg('-Dseamlessportals.despawnProbe=true') }
            // IS5-W FIX 1 A/B (2026-07-23): the shadow-scope clip suppression (the yaw-keyed shadow-wash
            // killer) is DEFAULT-ON; pass this to force it OFF and reproduce the wash (attribution proof;
            // the ShadowAliasProbe [FIX-1] counters classify the leg) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableShadowScopeClipFix=true
            if (project.findProperty('disableShadowScopeClipFix') == 'true') { vmArg('-Dseamlessportals.disableShadowScopeClipFix=true') }
            // IS5-W FIX 2+3 A/B (2026-07-23): the shadow/camera scope split + per-upload layer-batch clear
            // are DEFAULT-ON (one shared lever); pass this to force both OFF (expected: wave STAYS gone —
            // these are correctness/hygiene fixes for the scope collapse, not the wash carrier) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableShadowScopeIsolation=true
            if (project.findProperty('disableShadowScopeIsolation') == 'true') { vmArg('-Dseamlessportals.disableShadowScopeIsolation=true') }
            // IS5-G ghost-wave DISCRIMINATOR (2026-07-23): tint the IrisCompatPaste STAMP magenta —
            // ghost turns magenta => the ghost IS the stamp's paint overreaching the aperture (B3);
            // window magenta but ghost full-color => snapshot/other carrier. Run 2 (same session):
            //   /imm_ptl_client_debug debug_no_stamp_depth_clamp enable   (splits clamp-wedge (b))
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdebugTintStamp=true
            if (project.findProperty('debugTintStamp') == 'true') { vmArg('-Dseamlessportals.debugTintStamp=true') }
            // IS5-G dest-pass TAA-history clear A/B (2026-07-23): the ghost-terrain fix is DEFAULT-ON;
            // pass this to force it OFF and reproduce the source-over-dest ghost (attribution proof) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableIrisDestTaaClear=true
            if (project.findProperty('disableIrisDestTaaClear') == 'true') { vmArg('-Dseamlessportals.disableIrisDestTaaClear=true') }
            // IS5-PH prev-uniform heal A/B (2026-07-23): the ghost-terrain ROOT fix (re-tick iris's frame
            // notifier after the portal renders so previousCameraPosition stays MAIN-valued) is DEFAULT-ON;
            // pass this to force it OFF and reproduce the camera-tracked source-over-terrain ghost —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisablePrevUniformHeal=true
            if (project.findProperty('disablePrevUniformHeal') == 'true') { vmArg('-Dseamlessportals.disablePrevUniformHeal=true') }
            // IS5-ACT heal RETARGET (2026-07-26) — DEFAULT-ON fix: the heal ticks the PRE-LOOP main
            // pipeline instead of iris's manager slot, which after a cross-dim nested render holds
            // the DEST pipeline. Pass this to restore the old, poisoning resolution for A/B —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableHealRetarget=true
            if (project.findProperty('disableHealRetarget') == 'true') { vmArg('-Dseamlessportals.disableHealRetarget=true') }
            // IS5-MB dest-composite GATE PROBE (2026-07-26) — LOG-ONLY, default OFF. Reads
            // ProgramUniforms.lastFrame vs SystemTimeUniforms.COUNTER plus the REAL
            // cameraPosition/previousCameraPosition uniform storage at the composite4 (motion-blur)
            // pass, for BOTH the MAIN and the DEST role. ~2 lines/sec, no GL state change —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PmbGateProbe=true
            if (project.findProperty('mbGateProbe') == 'true') { vmArg('-Dseamlessportals.mbGateProbe=true') }
            // IS5-MB per-chain previous-frame camera correction — **DEFAULT ON**. Fixes the measured
            // same-dim portal-window smear: with a portal in view the dest content's composite4 reads
            // cameraPosition=DEST but previousCameraPosition=PLAYER, |cam-prev|=511.088 held constant
            // for 22 stationary seconds, a 265.8 PIXEL blur span (IS5-CEN census, 2026-07-26).
            // Pass this to force it OFF and reproduce the smear (attribution both directions) —
            // ** DEFAULT ON — USER-CONFIRMED LIVE 2026-07-26 ("FINALLY NOT BLURRY"). Corrects both blur
            // drivers on the same-dim portal window: the camera pair (|cam-prev| 721.852 -> 0.001, blur
            // span 136.3 -> 1.7 px) and the matrix pair, while preserving genuine motion blur when the
            // player is actually moving. Pass this to force it OFF and reproduce the smear: **
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PcompositeCensus=true -PdisableIrisDestPrevCamera=true
            if (project.findProperty('disableIrisDestPrevCamera') == 'true') { vmArg('-Dseamlessportals.disableIrisDestPrevCamera=true') }
            // MATRIX-HALF A/B, re-added and now meaningful: the correction writes BOTH the previous
            // camera and the previous matrices, because they are two independent blur drivers (rows
            // with a zero camera offset still blurred 57-102 px on a nonzero idMV). Pass this to write
            // the CAMERA half only and isolate driver A from driver B —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PcompositeCensus=true -PirisDestPrevCameraNoMatrices=true
            if (project.findProperty('irisDestPrevCameraNoMatrices') == 'true') { vmArg('-Dseamlessportals.irisDestPrevCameraNoMatrices=true') }
            // Chain-match limit in blocks, DEFAULT 4.0 — the furthest a composite chain's camera may
            // plausibly travel in one frame. It is the definition of "same chain", NOT a safety margin:
            // 16.0 was tried and is DANGEROUS (wider than an ordinary doorway portal's offset, so it
            // would adopt the destination camera as the main view's history). Lower it to tighten —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PirisDestPrevCameraMaxDelta=2.0
            if (project.hasProperty('irisDestPrevCameraMaxDelta')) { vmArg("-Dseamlessportals.irisDestPrevCameraMaxDelta=${project.property('irisDestPrevCameraMaxDelta')}") }
            // Guarded-pass override (comma-separated; default "composite4"). The once-only roster line
            // names every pass actually seen, so this is never guesswork —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PirisDestPrevCameraPass=composite4
            if (project.hasProperty('irisDestPrevCameraPass')) { vmArg("-Dseamlessportals.irisDestPrevCameraPass=${project.property('irisDestPrevCameraPass')}") }
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdestPrevCameraProbe=true
            if (project.findProperty('destPrevCameraProbe') == 'true') { vmArg('-Dseamlessportals.destPrevCameraProbe=true') }
            // IS5-MB ATTRIBUTION A/B (2026-07-26, DIAGNOSTIC): drop the portal stamp's DEPTH WRITE, to
            // test whether the stamped DEST depth is what makes composite4 compute a huge PER-PIXEL
            // velocity inside the window. If the blur vanishes with this set, that is the mechanism.
            // COST while set: re-opens the #13 two-portal "second paints over the first" artifact —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableStampDepthWrite=true
            if (project.findProperty('disableStampDepthWrite') == 'true') { vmArg('-Dseamlessportals.disableStampDepthWrite=true') }
            // IS5-SEAM §2d DEPTH-TEST DISCRIMINATOR (2026-07-27, DIAGNOSTIC): swap the stamp to a
            // sibling with the depth state FULLY DISABLED (test AND write). Band fills in => the
            // GEQUAL test vs the snapshot depth was rejecting the stamp at the seam; band PERSISTS
            // => depth rejection is NOT THE SOLE cause — do NOT exonerate depth from this leg alone
            // (the pipeline still paints SAMPLED content, so black dest content keeps the band
            // black regardless of depth); run the -PdebugStampSolid ladder (handoff §2d matrix).
            // Check the IS5-RC STAMP PIPELINE line before adjudicating —
