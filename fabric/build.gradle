            // force the UNCLAMPED repaints and reproduce the band (attribution both directions) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableBloomMaskSeamClamp=true
            if (project.findProperty('disableBloomMaskSeamClamp') == 'true') { vmArg('-Dseamlessportals.disableBloomMaskSeamClamp=true') }
            // IS5-SEAM attribution (DIAGNOSTIC ONLY): pass every aperture triangle through UNCLIPPED,
            // to settle whether the near-plane clip's removed area is the black seam band. Expect the
            // S14.36 sky wedges to return while set — that is also the proof the lever took effect —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableAperturePlaneClip=true
            if (project.findProperty('disableAperturePlaneClip') == 'true') { vmArg('-Dseamlessportals.disableAperturePlaneClip=true') }
            // IS5-CEN THE PER-FRAME COMPOSITE BIND CENSUS (2026-07-26, DIAGNOSTIC, default OFF).
            // Counts EVERY Program.use() in the process and, for the motion-blur pass, logs all six
            // gbuffer matrices, both camera vectors, the two never-before-measured inverse-consistency
            // checks (max|M*Minv - I|), and a CPU replay of composite4's own velocity arithmetic over a
            // 3x3x3 screen/depth grid — reported as the blur span in PIXELS. Emits one block per second
            // listing every bind of the most recent frame plus the whole second's bind-count range —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PcompositeCensus=true
            if (project.findProperty('compositeCensus') == 'true') { vmArg('-Dseamlessportals.compositeCensus=true') }
            // Rename the deeply-measured pass if the roster line shows the pack calls it something else
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PcompositeCensus=true -PcompositeCensusPasses=composite4,composite5
            if (project.hasProperty('compositeCensusPasses')) { vmArg("-Dseamlessportals.compositeCensusPasses=${project.property('compositeCensusPasses')}") }
            // C3-BLOOM aperture-mask A/B + probes (§2f; the suite runs iris-ABSENT => the mixin
            // is unwoven and the mask byte-inert; rows kept for lever-row parity) —
            if (project.findProperty('disableIrisBloomApertureMask') == 'true') { vmArg('-Dseamlessportals.disableIrisBloomApertureMask=true') }
            if (project.findProperty('debugTintBloomMask') == 'true') { vmArg('-Dseamlessportals.debugTintBloomMask=true') }
            if (project.findProperty('debugBloomMaskBlackout') == 'true') { vmArg('-Dseamlessportals.debugBloomMaskBlackout=true') }
            if (project.findProperty('bloomMaskProbe') == 'true') { vmArg('-Dseamlessportals.bloomMaskProbe=true') }
            // IS5-ACT gate probe (2026-07-25; the suite runs iris-ABSENT => ensureReflection hits
            // ClassNotFoundException and the probe disarms quietly — structurally inert; rows kept
            // for lever-row parity) —
            if (project.findProperty('actProbe') == 'true') { vmArg('-Dseamlessportals.actProbe=true') }
            if (project.findProperty('actVolumeProbe') == 'true') { vmArg('-Dseamlessportals.actVolumeProbe=true') }
            // IS5-ACT round-2 (the suite runs iris-ABSENT => both mixins are declined by
            // IPCompatMixinPlugin and ActDispatchProbe disarms on ClassNotFoundException —
            // structurally inert; row kept for lever-row parity) —
            if (project.findProperty('actDispatchProbe') == 'true') { vmArg('-Dseamlessportals.actDispatchProbe=true') }
        }
    }
}

// S17: the TITLE-CARD capture drives the BLOCK-ERA flow (NetherPortalBlock.entityInside
// teleport + the block-era portal view) — post-flip the default is entity portals, so its
// run dir is pinned flag-OFF to preserve the capture's purpose (a flag-ON title card is a
// future re-shoot; its June-era config file predates the flag key and would resolve to the
// new TRUE default otherwise).
tasks.matching { it.name == 'runClientGametest' }.configureEach {
    doFirst {
        def cfgDir = file('runs/gametest/config')
        cfgDir.mkdirs()
        new File(cfgDir, 'seamlessportals.properties').text = 'entityPortals=false\n'
    }
}

// Seed the entity-portal MASTER SWITCH into the crossing-smoke run dir before every
// launch. EntityPortalsFlag reads <configDir>/seamlessportals.properties ONCE at
// mixin-bootstrap (load-time, before any mod initializer), so the file must exist
// before the JVM starts — no in-game mechanism can flip it.
// S17 note: the explicit seed stays (redundant with the flipped default, but the test's
// contract should not silently depend on the shipping default).
tasks.matching { it.name == 'runCrossingGametest' }.configureEach {
    doFirst {
        def cfgDir = file('runs/gametest-crossing/config')
        cfgDir.mkdirs()
        new File(cfgDir, 'seamlessportals.properties').text = 'entityPortals=true\n'
        // Suppress IP's one-time first-launch splash (IPortalInitialScreen,
        // MixinGui append gate !initialScreenShown) — the client-gametest
        // framework asserts a bare title screen between tests, and the splash
        // sits over it. Gson AutoConfig leaves absent fields at their defaults.
        new File(cfgDir, 'immersive_portals.json').text = '{\n  "initialScreenShown": true\n}\n'
    }
}

processResources {
    var replaceProperties = [
        mod_id              : project.mod_id,
        mod_name            : project.mod_name,
        mod_version         : project.mod_version,
        mod_description     : project.mod_description,
        minecraft_version   : project.minecraft_version,
        minecraft_version_range : project.minecraft_version_range,
        fabric_loader_version : project.fabric_loader_version,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}
