            if (project.findProperty('disableCrossViewReverseWindow') == 'true') { vmArg('-Dseamlessportals.disableCrossViewReverseWindow=true') }
            // IS5-REC recursive portal layers (shaders ON). A/B in BOTH directions:
            //   .gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableIrisPortalRecursion=true
            // and the depth sweep / exact one-layer behavioural repro:
            //   -PirisMaxPortalLayer=1 (identical to the pre-IS5-REC guard) | =2 (default) | =3
            if (project.findProperty("disableIrisPortalRecursion") == "true") { vmArg("-Dseamlessportals.disableIrisPortalRecursion=true") }
            // IS5-TERM A/B: restore the solid-black terminal portal at the recursion bound (shaders OFF).
            if (project.findProperty("drawTerminalPortalAsBlack") == "true") { vmArg("-Dseamlessportals.drawTerminalPortalAsBlack=true") }
            // IS5-XREC A/B: restore the no-recursion-inside-the-cross-view-window scope limit.
            if (project.findProperty("disableCrossViewRecursion") == "true") { vmArg("-Dseamlessportals.disableCrossViewRecursion=true") }
            if (project.hasProperty("irisMaxPortalLayer")) { vmArg("-Dseamlessportals.irisMaxPortalLayer=" + project.irisMaxPortalLayer) }
            if (project.hasProperty("irisMaxDestRenders")) { vmArg("-Dseamlessportals.irisMaxDestRenders=" + project.irisMaxDestRenders) }
            // IS5-XCUT NEAR FLOOR MOVED TO THE FRAGMENT STAGE — DEFAULT ON (2026-08-01). The stamp's
            // floor was applied PER VERTEX; depth interpolates screen-affine, so that TILTED the
            // interpolated depth plane instead of clamping it, and one clip-produced vertex ~0.1 mm
            // from the eye skewed the whole plane => a straight depth boundary that SWEEPS across
            // the portal window as the camera pans near the seam. Now applied per fragment.
            // Pass this to force the old per-vertex floor back and REPRODUCE the swept cut —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableXcutFragFloor=true
            if (project.findProperty('disableXcutFragFloor') == 'true') { vmArg('-Dseamlessportals.disableXcutFragFloor=true') }
        }
        // Automated title-card capture via the Fabric client-gametest API.
        // Drives a real client: creates a world, builds + lights a portal,
        // walks through, frames the nether->overworld portal view and
        // screenshots it. Triggered by the fabric.client.gametest.modid
        // system property naming our mod, which routes to the
        // "fabric-client-gametest" entrypoint in fabric.mod.json.
        clientGametest {
            client()
            setConfigName('Title Card Capture')
            runDir('runs/gametest')
            // 'fabric.client.gametest' (presence) ENABLES the client-gametest
            // framework — its mixin config plugin gates every client-gametest
            // mixin (incl. the Main hook that starts the runner) on this flag.
            // 'fabric.client.gametest.modid' then filters which mod's tests run.
            // Both are required; the modid filter alone is inert.
            property('fabric.client.gametest', 'true')
            property('fabric.client.gametest.modid', project.mod_id)
            // Selects WHICH of the mod's client-gametests runs (the framework
            // runs every registered entrypoint otherwise; each test class
            // no-ops unless selected).
            property('seamlessportals.gametest.only', 'titlecard')
            // TP-XDIM frame census (mirror of the clientSodium lever). This run is iris-ABSENT and
            // never enters third person, so no row will ever read TARGET ACQUIRED — but the census
            // still emits a full window block ~1 Hz for every in-world frame, which on a gametest
            // leg competes with the log rotation. Byte-inert without the property.
            if (project.findProperty('tpXdimCensus') == 'true') { vmArg('-Dseamlessportals.tpXdimCensus=true') }
            if (project.findProperty('tpXdimCensusGl') == 'true') { vmArg('-Dseamlessportals.tpXdimCensusGl=true') }
            // TP-XDIM CROSS-VIEW FULL-PIPELINE ROUTE — DEFAULT ON (2026-07-28). The measured
            // third-person + shaderpack whole-screen terrain explosion is the D23 decomposed driver
            // running as a FRAME-REPLACING render: no LevelRenderer.render => none of iris's
            // per-frame gbuffer setup, while its shader programs still substitute. The fix routes
            // that one layer-0 caller to the full-pipeline driver (IP's own architecture — IP's
            // cross-view frame ran a nested full renderLevel). Pass this to force the pre-fix route
            // and REPRODUCE the explosion — the A/B leg that proves the fix —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableCrossViewFullPipeline=true
            if (project.findProperty('disableCrossViewFullPipeline') == 'true') { vmArg('-Dseamlessportals.disableCrossViewFullPipeline=true') }
            // TP-XDIM ESCAPE HATCH (DEFAULT OFF): decline the cross-portal view while a shaderpack
            // is running — vanilla renderLevel renders the frame and the third-person camera clips
            // into the portal wall (IP's pre-cross-view behaviour: ugly, never corrupt). The
            // fallback if the route above proves unusable, and this arc's NEGATIVE discriminator
            // (explosion SURVIVES it => the cross-view path is not the carrier) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PcrossViewSuppressUnderPack=true
            if (project.findProperty('crossViewSuppressUnderPack') == 'true') { vmArg('-Dseamlessportals.crossViewSuppressUnderPack=true') }
            // XWIN REVERSE WINDOW INSIDE THE CROSS VIEW — DEFAULT ON (2026-07-29). On a cross-view
            // frame the dest world now renders correctly but NO portal window was drawn inside it,
            // so the player's body — which is in the other dimension — was invisible. The DECOMPOSED
            // core has always had this slot (Step 10.10), which is why shaders-OFF already shows the
            // window (M0, user-confirmed); the FULL-PIPELINE core was missing its twin. Pass this to
            // force the pre-fix route and REPRODUCE the missing window — the A/B that proves it —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableCrossViewReverseWindow=true
            if (project.findProperty('disableCrossViewReverseWindow') == 'true') { vmArg('-Dseamlessportals.disableCrossViewReverseWindow=true') }
            // IS5-REC recursive portal layers (shaders ON). A/B in BOTH directions:
            //   .gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableIrisPortalRecursion=true
            // and the depth sweep / exact one-layer behavioural repro:
            //   -PirisMaxPortalLayer=1 (identical to the pre-IS5-REC guard) | =2 (default) | =3
            if (project.findProperty("disableIrisPortalRecursion") == "true") { vmArg("-Dseamlessportals.disableIrisPortalRecursion=true") }
            // IS5-TERM A/B: restore the solid-black terminal portal at the recursion bound (shaders OFF).
            if (project.findProperty("drawTerminalPortalAsBlack") == "true") { vmArg("-Dseamlessportals.drawTerminalPortalAsBlack=true") }
            // IS5-XREC A/B: restore the no-recursion-inside-the-cross-view-window scope limit.
            if (project.findProperty("disableCrossViewRecursion") == "true") { vmArg("-Dseamlessportals.disableCrossViewRecursion=true") }
            if (project.hasProperty("irisMaxPortalLayer")) { vmArg("-Dseamlessportals.irisMaxPortalLayer=" + project.irisMaxPortalLayer) }
            if (project.hasProperty("irisMaxDestRenders")) { vmArg("-Dseamlessportals.irisMaxDestRenders=" + project.irisMaxDestRenders) }
            // IS5-XCUT NEAR FLOOR MOVED TO THE FRAGMENT STAGE — DEFAULT ON (2026-08-01). The stamp's
            // floor was applied PER VERTEX; depth interpolates screen-affine, so that TILTED the
            // interpolated depth plane instead of clamping it, and one clip-produced vertex ~0.1 mm
            // from the eye skewed the whole plane => a straight depth boundary that SWEEPS across
            // the portal window as the camera pans near the seam. Now applied per fragment.
            // Pass this to force the old per-vertex floor back and REPRODUCE the swept cut —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableXcutFragFloor=true
            if (project.findProperty('disableXcutFragFloor') == 'true') { vmArg('-Dseamlessportals.disableXcutFragFloor=true') }
        }
        // S15 entity-crossing smoke on the UNIFIED path (EXECUTION_PLAN §S15,
        // D4.6 — re-run at every later stage). Own run dir: its config is
        // seeded with entityPortals=true (the load-time master switch) before
        // every launch, so it never contaminates the title-card run dir.
        crossingGametest {
            client()
            setConfigName('Entity Crossing Smoke')
            runDir('runs/gametest-crossing')
            property('fabric.client.gametest', 'true')
            property('fabric.client.gametest.modid', project.mod_id)
            property('seamlessportals.gametest.only', 'crossing')
            // C2 JIT protection — see migration/C2_JIT_PROTECTION.md and ext.c2JitArgs
            // at the top of this file. Default: one dontinline on the leaf. Levers:
            // -Pc2LegacyExcludes (the historical six), -Pc2NoProtection (reproduce), -Pc2Inlining.
            c2JitArgs().each { vmArg(it) }
            // IS1 diagnostics: repeated hot-loop exceptions (the row-1 batching AIOOBE) get
            // stack-elided by HotSpot fast-throw, making crash reports frameless. Keep frames.
            vmArg('-XX:-OmitStackTraceInFastThrow')
            // IS0 shaderpack-views probe (mirror of the clientSodium lever above; the suite
            // runs sodium/iris-ABSENT, so with no pack the probe only logs its one-shot
            // waiting line — byte-inert for the 8-leg gate without the property) —
            //   .\gradlew.bat :fabric:runCrossingGametest -PshaderpackViewsProbe=true
            if (project.findProperty('shaderpackViewsProbe') == 'true') { vmArg('-Dseamlessportals.shaderpackViewsProbe=true') }
            // IS1 visual pre-screen screenshots (CrossingSmoke.maybeScreenshot; the self-run
            // rounds capture portal-view frames for multimodal classification) —
            //   .\gradlew.bat :fabric:runCrossingGametest -PgametestScreenshots=true
            if (project.findProperty('gametestScreenshots') == 'true') { vmArg('-Dseamlessportals.gametest.screenshots=true') }
            // IS1 shaderpack-views renderer lever (mirror; the suite runs sodium/iris-ABSENT —
            // with the lever the compat renderer routes even shaders-OFF, so an armed suite run
            // exercises the full-pipeline driver under the 8 legs) —
            //   .\gradlew.bat :fabric:runCrossingGametest -PshaderpackViews=true
            if (project.findProperty('shaderpackViews') == 'true') { vmArg('-Dseamlessportals.shaderpackViews=true') }
            // IS3 clip discriminator probe (mirror of the clientSodium lever; §4.7). With the
            // shaderpackViews lever armed the suite runs the full-pipeline driver, so an armed
            // clipProbe run dumps the per-draw enable-decisions under the 8 legs —
            //   .\gradlew.bat :fabric:runCrossingGametest -PshaderpackViews=true -PclipProbe=true
            if (project.findProperty('clipProbe') == 'true') { vmArg('-Dseamlessportals.clipProbe=true') }
            // IS5 shadow-emptiness probe (mirror of the clientSodium lever; §5). The suite runs
            // iris-ABSENT, so the probe self-disarms on the first capture (iris ClassNotFound) —
            // byte-inert for the 8-leg gate without the property; armed only for a manual iris run —
            //   .\gradlew.bat :fabric:runCrossingGametest -PshaderpackViews=true -PshadowProbe=true
            if (project.findProperty('shadowProbe') == 'true') { vmArg('-Dseamlessportals.shadowProbe=true') }
            // C2-1 SAME-DIM FLASH FIX A/B (2026-07-21): the per-portal-layer MultiDrawBatch isolation
            // is DEFAULT-ON; pass this to force it OFF and reproduce the same-dim source-terrain vanish
            // (attribution proof) —
            //   .\gradlew.bat :fabric:runClientSodium -PsodiumRuntime=true -PdisablePortalBatchIsolation=true
            if (project.findProperty('disablePortalBatchIsolation') == 'true') { vmArg('-Dseamlessportals.disablePortalBatchIsolation=true') }
            // IS5-P phantom fix A/B (2026-07-22): the iris temporal-target guard is DEFAULT-ON; pass this to
            // force it OFF and reproduce the whole-screen phantom overlay (attribution proof) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableIrisTemporalGuard=true
            if (project.findProperty('disableIrisTemporalGuard') == 'true') { vmArg('-Dseamlessportals.disableIrisTemporalGuard=true') }
            // IS5-L in-portal-fullbright fix A/B (2026-07-22): the iris per-frame-uniform re-upload (counter
            // bump around the dest render) is DEFAULT-ON; pass this to force it OFF and reproduce the
            // direction-dependent fullbright (attribution proof) —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableIrisPerFrameRefresh=true
            if (project.findProperty('disableIrisPerFrameRefresh') == 'true') { vmArg('-Dseamlessportals.disableIrisPerFrameRefresh=true') }
            // IS5-L in-portal-fullbright PROBE (migration/FULLBRIGHT_HANDOFF.md §5): DEFAULT-OFF,
            // log-only (mirror of the clientSodium lever). The suite runs iris-ABSENT, so the probe
            // self-disarms on the first draw (iris ClassNotFound) — byte-inert for the 8-leg gate
            // without the property; armed only for a manual iris run —
            //   .\gradlew.bat :fabric:runCrossingGametest -PshaderpackViews=true -PfullbrightProbe=true
            if (project.findProperty('fullbrightProbe') == 'true') { vmArg('-Dseamlessportals.fullbrightProbe=true') }
            // IS5-W shadow-alias probe (mirror of the clientSodium lever). The suite runs
            // iris-ABSENT, so the probe quietly disarms on first emit — byte-inert for the
            // 8-leg gate without the property —
            //   .\gradlew.bat :fabric:runCrossingGametest -PshaderpackViews=true -PshadowAliasProbe=true
            if (project.findProperty('shadowAliasProbe') == 'true') { vmArg('-Dseamlessportals.shadowAliasProbe=true') }
            // §2b dest-entity funnel probe (1Hz [ENT-PROBE] lines; default OFF):
            //   .\gradlew.bat :fabric:runCrossingGametest -PentityProbe=true
            if (project.findProperty('entityProbe') == 'true') { vmArg('-Dseamlessportals.entityProbe=true') }
            // §2b compat same-dim entity fill A/B (2026-07-24): DEFAULT-ON; suite runs iris-absent so this
            // is inert there — kept for lever-row parity —
            //   .\gradlew.bat :fabric:runCrossingGametest -PdisableCompatSameDimEntities=true
            if (project.findProperty('disableCompatSameDimEntities') == 'true') { vmArg('-Dseamlessportals.disableCompatSameDimEntities=true') }
            // §2c source-particle cull A/B (2026-07-25): DEFAULT-ON; lever-row parity —
            //   .\gradlew.bat :fabric:runCrossingGametest -PdisableSourceParticleCull=true
            if (project.findProperty('disableSourceParticleCull') == 'true') { vmArg('-Dseamlessportals.disableSourceParticleCull=true') }
            // IS-BOB iris bob-sync A/B (2026-07-25): DEFAULT-ON; iris-absent => inert; lever-row parity —
            //   .\gradlew.bat :fabric:runCrossingGametest -PdisableIrisBobSync=true
            if (project.findProperty('disableIrisBobSync') == 'true') { vmArg('-Dseamlessportals.disableIrisBobSync=true') }
            // IS-BOB 1Hz [BOB-SYNC] probe (default OFF; lever-row parity):
            //   .\gradlew.bat :fabric:runCrossingGametest -PbobSyncProbe=true
            if (project.findProperty('bobSyncProbe') == 'true') { vmArg('-Dseamlessportals.bobSyncProbe=true') }
            // §2g despawn-suppress A/B + probe (2026-07-25): suite mobs are a Cow
            // (removeWhenFarAway=false) + thrown items with the gametest player nearby — the fix is
            // structurally inert there; rows kept for lever-row parity —
            if (project.findProperty('disableTicketDespawnSuppress') == 'true') { vmArg('-Dseamlessportals.disableTicketDespawnSuppress=true') }
            if (project.findProperty('despawnProbe') == 'true') { vmArg('-Dseamlessportals.despawnProbe=true') }
            // IS5-FF A/B + probe (§2h): iris-absent => the suppressor class never loads; lever-row parity —
            if (project.findProperty('disableNestedShadowComposite') == 'true') { vmArg('-Dseamlessportals.disableNestedShadowComposite=true') }
            if (project.findProperty('nestedShadowCompositeProbe') == 'true') { vmArg('-Dseamlessportals.nestedShadowCompositeProbe=true') }
            // IS5-W FIX 1 + FIX 2/3 A/B (mirrors of the clientSodium levers; the suite runs iris-ABSENT,
            // so both fixes are inert there — isRenderingShadowMap() is constant false) —
            if (project.findProperty('disableShadowScopeClipFix') == 'true') { vmArg('-Dseamlessportals.disableShadowScopeClipFix=true') }
            if (project.findProperty('disableShadowScopeIsolation') == 'true') { vmArg('-Dseamlessportals.disableShadowScopeIsolation=true') }
            if (project.findProperty('disableIrisDestTaaClear') == 'true') { vmArg('-Dseamlessportals.disableIrisDestTaaClear=true') }
            if (project.findProperty('disablePrevUniformHeal') == 'true') { vmArg('-Dseamlessportals.disablePrevUniformHeal=true') }
            // IS5-ACT heal RETARGET (2026-07-26) — DEFAULT-ON fix: the heal ticks the PRE-LOOP main
            // pipeline instead of iris's manager slot, which after a cross-dim nested render holds
            // the DEST pipeline. Pass this to restore the old, poisoning resolution for A/B —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PdisableHealRetarget=true
            if (project.findProperty('disableHealRetarget') == 'true') { vmArg('-Dseamlessportals.disableHealRetarget=true') }
            // IS5-MB dest-composite GATE PROBE (2026-07-26) — LOG-ONLY, default OFF. Reads
            // ProgramUniforms.lastFrame vs SystemTimeUniforms.COUNTER plus the REAL
            // cameraPosition/previousCameraPosition uniform storage at the composite4 (motion-blur)
            // pass, for BOTH the MAIN and the DEST role. ~2 lines/sec, no GL state change —
            //   .\gradlew.bat :fabric:runClientSodium -PirisRuntime=true -PmbGateProbe=true
            if (project.findProperty('mbGateProbe') == 'true') { vmArg('-Dseamlessportals.mbGateProbe=true') }
            // IS5-MB per-chain previous-frame camera correction — **DEFAULT ON**. Fixes the measured
            // same-dim portal-window smear: with a portal in view the dest content's composite4 reads
            // cameraPosition=DEST but previousCameraPosition=PLAYER, |cam-prev|=511.088 held constant
            // for 22 stationary seconds, a 265.8 PIXEL blur span (IS5-CEN census, 2026-07-26).
            // Pass this to force it OFF and reproduce the smear (attribution both directions) —
            // ** DEFAULT ON — USER-CONFIRMED LIVE 2026-07-26 ("FINALLY NOT BLURRY"). Corrects both blur
            // drivers on the same-dim portal window: the camera pair (|cam-prev| 721.852 -> 0.001, blur
