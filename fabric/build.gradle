            if (project.hasProperty("irisMaxDestRenders")) { vmArg("-Dseamlessportals.irisMaxDestRenders=" + project.irisMaxDestRenders) }
            // IS5-CEN composite census (mirror of the clientSodium lever): per-bind |cam-prev| —
            // the MB-liveness instrument for driver legs (2026-08-05: harness strafe frames
            // measured blur-free on BOTH paths; the census says whether the camera delta ever
            // reaches the MB pass in-harness).
            if (project.findProperty('compositeCensus') == 'true') { vmArg('-Dseamlessportals.compositeCensus=true') }
            if (project.hasProperty('compositeCensusPasses')) { vmArg("-Dseamlessportals.compositeCensusPasses=${project.property('compositeCensusPasses')}") }
        }
    }
}

// S17: the TITLE-CARD capture drives the BLOCK-ERA flow (NetherPortalBlock.entityInside
// teleport + the block-era portal view) — post-flip the default is entity portals, so its
// run dir is pinned flag-OFF to preserve the capture's purpose (a flag-ON title card is a
// future re-shoot; its June-era config file predates the flag key and would resolve to the
// new TRUE default otherwise).
tasks.matching { it.name == 'runClientGametest' }.configureEach {
    doFirst {
        def cfgDir = file('runs/gametest/config')
        cfgDir.mkdirs()
        new File(cfgDir, 'seamlessportals.properties').text = 'entityPortals=false\n'
    }
}

// Seed the entity-portal MASTER SWITCH into the crossing-smoke run dir before every
// launch. EntityPortalsFlag reads <configDir>/seamlessportals.properties ONCE at
// mixin-bootstrap (load-time, before any mod initializer), so the file must exist
// before the JVM starts — no in-game mechanism can flip it.
// S17 note: the explicit seed stays (redundant with the flipped default, but the test's
// contract should not silently depend on the shipping default).
tasks.matching { it.name == 'runCrossingGametest' }.configureEach {
    doFirst {
        def cfgDir = file('runs/gametest-crossing/config')
        cfgDir.mkdirs()
        new File(cfgDir, 'seamlessportals.properties').text = 'entityPortals=true\n'
        // Suppress IP's one-time first-launch splash (IPortalInitialScreen,
        // MixinGui append gate !initialScreenShown) — the client-gametest
        // framework asserts a bare title screen between tests, and the splash
        // sits over it. Gson AutoConfig leaves absent fields at their defaults.
        new File(cfgDir, 'immersive_portals.json').text = '{\n  "initialScreenShown": true\n}\n'
    }
}

// IS5 regression driver run dir: crossing-parity seeds (entity portals ON, splash suppressed)
// PLUS the iris stage — the shaderpack AND its option sidecar are copied from the live
// client-sodium run dir, so a driver leg runs under the user's exact pack-option state
// (MB=1 str=2.00, TAA_JITTER=2, LENSFLARE_MODE=2 as of 2026-08-05). The sidecar content is
// echoed to the build log at every launch: the pack-options-drift discipline wants each leg's
// option state ON THE RECORD, and an absent key means pack default, not "off".
tasks.matching { it.name == 'runIs5RegressionGametest' }.configureEach {
    doFirst {
        def cfgDir = file('runs/gametest-is5/config')
        cfgDir.mkdirs()
        new File(cfgDir, 'seamlessportals.properties').text = 'entityPortals=true\n'
        new File(cfgDir, 'immersive_portals.json').text = '{\n  "initialScreenShown": true\n}\n'
        def packDir = file('runs/gametest-is5/shaderpacks')
        packDir.mkdirs()
        def srcPack = file('runs/client-sodium/shaderpacks/ComplementaryReimagined_r5.8.1.zip')
        def srcSidecar = file('runs/client-sodium/shaderpacks/ComplementaryReimagined_r5.8.1.zip.txt')
        if (srcPack.exists()) {
            def dstPack = new File(packDir, srcPack.name)
            if (!dstPack.exists() || dstPack.length() != srcPack.length()) {
                dstPack.bytes = srcPack.bytes
            }
            if (srcSidecar.exists()) {
                new File(packDir, srcSidecar.name).text = srcSidecar.text
                logger.lifecycle('[IS5-GT] sidecar staged: '
                    + srcSidecar.text.readLines().findAll { it.contains('=') }.join(' | '))
            }
            new File(cfgDir, 'iris.properties').text =
                "enableShaders=true\nshaderPack=${srcPack.name}\nmaxShadowRenderDistance=32\n"
        } else {
            logger.lifecycle('[IS5-GT] NO shaderpack found in runs/client-sodium/shaderpacks —'
                + ' this run is iris-inert (fine for a plain smoke, VOID for a shaders-ON leg)')
        }
    }
}

processResources {
    var replaceProperties = [
        mod_id              : project.mod_id,
        mod_name            : project.mod_name,
        mod_version         : project.mod_version,
        mod_description     : project.mod_description,
        minecraft_version   : project.minecraft_version,
        minecraft_version_range : project.minecraft_version_range,
        fabric_loader_version : project.fabric_loader_version,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}
