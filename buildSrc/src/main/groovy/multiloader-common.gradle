import com.warwa.seamlessportals.gradle.IpHeldPaths

plugins {
    id 'java-library'
    id 'maven-publish'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)

// TOOLCHAIN VENDOR — OPT-IN, unset by default (2026-08-01, the Temurin 25.0.2 C2 crash test).
// The language-version pin alone is NOT deterministic when two JDKs of that version are installed:
// with Zulu 25.0.4 and the Gradle-provisioned Temurin 25.0.2 both detected, setting
// org.gradle.java.installations.paths + auto-download=false was NOT enough — loom's runClient was
// MEASURED still launching on eclipse_adoptium-25 (read off the live process command line, not
// inferred). Only a vendor spec makes the choice deterministic, and it must be here because loom
// derives the run task's launcher from this same toolchain.
// Opt-in via -PjdkVendor / gradle.properties so the default build is unchanged for anyone else:
//   .\gradlew.bat :fabric:runClientSodium -PjdkVendor=AZUL
if (project.hasProperty('jdkVendor') && project.jdkVendor?.trim()) {
    java.toolchain.vendor = JvmVendorSpec.matching(project.jdkVendor.trim())
    logger.lifecycle("[toolchain] ${project.name}: JDK ${project.java_version} vendor pinned to '${project.jdkVendor.trim()}'")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// D1 holding machinery (entity-portal migration — migration/EXECUTION_PLAN.md §1 D1, §3 S0):
// held IP source under qouteall/** is excluded from :common's compile TASKS while the
// gradle property ip_scc_closed != 'true' (never from the source set — see IpHeldPaths).
// The loader modules' compileJava tasks get the same MAIN-list wiring in
// multiloader-loader.gradle, next to the source(configurations.commonJava) consumption;
// :common:compileTestJava carries its OWN list (D1.3). Compile probe (expected red until S13):
//   .\gradlew.bat :common:compileJava -Pip_scc_closed=true --console=plain --no-daemon
// Removed at S20 with the rest of the holding machinery.
if (project.path == ':common') {
    tasks.named('compileJava', JavaCompile).configure { JavaCompile t ->
        IpHeldPaths.applyHolding(project, t, IpHeldPaths.MAIN_HELD_PATHS)
    }
    tasks.named('compileTestJava', JavaCompile).configure { JavaCompile t ->
        IpHeldPaths.applyHolding(project, t, IpHeldPaths.TEST_HELD_PATHS)
    }
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-${project.name}"
}

java {
    withSourcesJar()
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Specification-Vendor'  : project.mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.mod_name,
            'Implementation-Version': project.mod_version,
            'Implementation-Vendor' : project.mod_authors,
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.rootDir}/repo"
        }
    }
}
