plugins {
    id 'java-library'
    id 'maven-publish'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// S20 increment 4: the D1 holding machinery (IpHeldPaths + the ip_scc_closed property + both
// held lists + the probe) is deleted. It existed to exclude ported-but-not-yet-closed IP source
// under qouteall/** from the compile TASKS while the port was in flight; the SCC closed at S13-B
// and the property has been permanently true since.

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-${project.name}"
}

java {
    withSourcesJar()
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Specification-Vendor'  : project.mod_authors,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.mod_name,
            'Implementation-Version': project.mod_version,
            'Implementation-Vendor' : project.mod_authors,
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.rootDir}/repo"
        }
    }
}
