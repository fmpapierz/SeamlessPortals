import com.warwa.seamlessportals.gradle.IpHeldPaths

plugins {
    id 'multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
    compileOnly project(':common')

    // F21 stub-classpath (entity-portal migration — S00-U0-decisions F21;
    // migration/EXECUTION_PLAN.md §3 S4(a)). This loader's compileJava recompiles the RAW
    // common source directory (source(configurations.commonJava) below), so at the
    // -Pip_scc_closed=true probe it also compiles IP's held compat files, which reference
    // third-party sodium/iris/gravity_changer types absent on MC 26.2. The same empty
    // shells :common uses must therefore be on THIS task's compile classpath too.
    // compileOnly ONLY — never shipped by the loader jar. Removed at S20.
    compileOnly project(path: ':common', configuration: 'ipStubsClasspath')
}

tasks.named('compileJava', JavaCompile).configure { JavaCompile t ->
    t.source(configurations.commonJava)
    // D1 holding machinery (migration/EXECUTION_PLAN.md §1 D1 item 2): the line above
    // feeds the RAW common source directory to this loader's compiler, so a held-paths
    // filter on :common:compileJava does NOT propagate here — the same MAIN list must be
    // applied to this task too, or the loader build goes red the moment the first held
    // qouteall/** file lands. Inert while the MAIN list has no matches on disk; gated on
    // ip_scc_closed != 'true'. Removed at S20.
    IpHeldPaths.applyHolding(project, t, IpHeldPaths.MAIN_HELD_PATHS)
}

tasks.named('processResources', ProcessResources).configure {
    from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar).configure {
    from(configurations.commonJava)
    from(configurations.commonResources)
}
