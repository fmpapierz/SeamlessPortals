org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Mod properties
mod_id=seamlessportals
mod_name=Seamless Portals
mod_version=1.0.0
mod_group_id=com.warwa.seamlessportals
mod_authors=warwa
mod_license=All Rights Reserved
mod_description=See through portals, walk through seamlessly, shoot arrows across dimensions. Immersive portal experience for Minecraft.

# Common
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
java_version=25

# NeoForge
neo_version=26.2.0.1-beta
neo_version_range=[26.2,)
neo_form_version=26.2-1
loader_version_range=[4,)

# Fabric
fabric_version=0.152.1+26.2
fabric_loader_version=0.19.3

# S19-E render-mod compat (real Sodium/Iris for MC 26.2, overturning the F21
# "no 26.2 build" premise). Resolved from the Modrinth maven; compileOnly on all
# three modules (the loaders recompile :common's raw source, which now references
# the real sodium/iris types after the F21 stub retirement). Iris pins the exact
# sodium build it needs at runtime. See fabric/build.gradle + common/build.gradle.
sodium_version=mc26.2-0.9.1-fabric
iris_version=1.11.2+26.2-fabric

# S19-E: real Cloth Config for MC 26.2, retiring the F21 me.shedaniel.autoconfig
# functional no-op (common/src/main/java/me/shedaniel/**). Resolves from the
# shedaniel maven (https://maven.shedaniel.me/). :common/:neoforge compileOnly
# (the me.shedaniel.autoconfig imports must compile there), :fabric implementation
# (the config GUI is runtime code + cloth is a real Fabric mod loom loads). See the
# per-module dependency comments. Transitive fabric-loader + fabric-api are excluded
# (IP's own build.gradle precedent). Verified resolvable from the shedaniel maven.
cloth_config_version=26.2.155
