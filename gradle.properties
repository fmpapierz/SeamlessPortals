# 26.3 BUMP (2026-09-20): every version pin in this file moved 26.2 -> 26.3 (MC 26.3 released
# 2026-09-15, still Java 25 / java-runtime-epsilon, still unobfuscated). Each value was read off the
# official metadata on that date, not guessed: Mojang version manifest, meta.fabricmc.net +
# fabric-example-mod@26.3, maven.neoforged.net + NeoForgeMDKs/MDK-26.3-ModDevGradle,
# api.modrinth.com (sodium/iris), maven.shedaniel.me (cloth). The 26.2-era comments below are kept
# verbatim as the historical record of WHY each pin exists. Ledger: migration/MC_26_3_VERSION_DELTA.md.

# Common
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
java_version=25

# NeoForge
neo_version=26.3.0.7-beta
neo_version_range=[26.3,)
neo_form_version=26.3-1
loader_version_range=[4,)

# Forge (MinecraftForge) — 26.3 port addition. 26.3-66.0.2 = latest on maven.minecraftforge.net 2026-09-20;
# ForgeGradle 7.0.40 (Gradle Plugin Portal, needs Gradle >= 9.3). Module is opt-in: -Penable_forge=true.
forge_version=66.0.2
forge_version_range=[66,)
forge_loader_version_range=[66,)
# ForgeGradle 7 only (read by the FG7 plugin, i.e. by :forge alone): put each source set's classes AND resources in ONE
# output directory. Without it a dev run sees two modules — `seamlessportals` (resources: mods.toml, META-INF/services)
# and `main` (classes) — exporting the same packages, and ModLauncher refuses to build the GAME layer (measured, first
# :forge:runClient: "ResolutionException: Modules seamlessportals and main export package
# com.warwa.seamlessportals.forge.platform to module minecraft").
net.minecraftforge.gradle.merge-source-sets=true

# Fabric
fabric_version=0.161.0+26.3
fabric_loader_version=0.19.5

# Quilt — 26.3 port addition. There is NO quilt module: Quilt support on 26.x is the Fabric jar (Quilt Loader >= 0.30
# loads fabric.mod.json mods; QSL/QFAPI retired as of 26.1). This pin is only what the opt-in production-style smoke
# run uses (:fabric:runQuiltClient -Penable_quilt_run=true). 0.31.0-beta.4 = newest on maven.quiltmc.org 2026-09-20 and
# the first line that PROVIDES fabricloader 0.19.5, which this mod's fabric.mod.json requires (>= 0.19.5 is a hard
# floor, not a convention: Fabric Loader 0.19.4 is what made com.mojang.renderpearl classes access-widenable, and the
# mod widens two of them). Quilt STABLE 0.30.1 provides 0.19.3 and correctly refuses the mod at dependency resolution.
quilt_loader_version=0.31.0-beta.4

# S19-E render-mod compat (real Sodium/Iris for MC 26.2, overturning the F21
# "no 26.2 build" premise). Resolved from the Modrinth maven; compileOnly on all
# three modules (the loaders recompile :common's raw source, which now references
# the real sodium/iris types after the F21 stub retirement). Iris pins the exact
# sodium build it needs at runtime. See fabric/build.gradle + common/build.gradle.
sodium_version=mc26.3-0.9.2-fabric
iris_version=1.11.6+26.3-fabric

# S19-E: real Cloth Config for MC 26.2, retiring the F21 me.shedaniel.autoconfig
# functional no-op (common/src/main/java/me/shedaniel/**). Resolves from the
# shedaniel maven (https://maven.shedaniel.me/). :common/:neoforge compileOnly
# (the me.shedaniel.autoconfig imports must compile there), :fabric implementation
# (the config GUI is runtime code + cloth is a real Fabric mod loom loads). See the
# per-module dependency comments. Transitive fabric-loader + fabric-api are excluded
# (IP's own build.gradle precedent). Verified resolvable from the shedaniel maven.
cloth_config_version=26.3.158

# ===== TOOLCHAIN PIN — the Temurin 25.0.2 C2 JIT crash test (2026-08-01) ======================
# java_version=25 above pins the LANGUAGE VERSION ONLY, with no vendor, so Gradle's foojay resolver
# auto-downloaded Temurin 25.0.2+10 (2026-01-20) into ~/.gradle/jdks — and that is the JVM in all
# three hs_err_pid crash logs: EXCEPTION_ACCESS_VIOLATION on a C2 CompilerThread, frame
# jvm.dll+0x73238f, native frames ALL jvm.dll, zero Java frames. Five victims so far, four of them
# in the portal occlusion-query path, each exclude just pushing C2 to the adjacent frame.
# Temurin 25.0.2 is TWO patch releases behind (25.0.3, 25.0.4 both shipped HotSpot fixes).
# This points the toolchain at the Zulu 25.0.4+7 ALREADY INSTALLED on this machine — same upstream
# OpenJDK patch level as the newest Temurin, zero download, and loom uses the toolchain for
# runClient too, so the GAME runs on it as well (which is the point).
# auto-download=false is what makes this provable rather than hopeful: with it off, Gradle CANNOT
# silently fall back to the provisioned Temurin — if the pin is wrong the build fails loudly.
# TO REVERT: delete these two lines. If the crash stops, also delete the five CompileCommand
# exclude rows in fabric/build.gradle and get that JIT optimization back on the render path.
# MEASURED INSUFFICIENT ON THEIR OWN: with both Zulu 25.0.4 and the Gradle-provisioned Temurin
# 25.0.2 detected, these two lines did NOT decide the choice — loom's runClient was observed still
# launching on eclipse_adoptium-25 (read off the LIVE process command line, not inferred). They are
# kept because they make the Zulu install visible and stop a silent re-download, but the line that
# actually decides is jdkVendor below (consumed by buildSrc/multiloader-common.gradle, which is
# where loom derives the run task's launcher from).
org.gradle.java.installations.paths=C:\\Program Files\\Zulu\\zulu-25
org.gradle.java.installations.auto-download=false
# THE DECIDING LINE. Remove it (or set it empty) to go straight back to the default resolution.
jdkVendor=AZUL

