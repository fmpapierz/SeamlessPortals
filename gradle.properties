org.gradle.parallel=true
org.gradle.caching=true

# Entity-portal migration, D1 holding machinery (migration/EXECUTION_PLAN.md §1 D1, §3 S0).
# While false, ported-but-not-yet-closed IP source under qouteall/** is excluded from the
# compile TASKS (see buildSrc com.warwa.seamlessportals.gradle.IpHeldPaths). Compile probe
# (the machine-checked forward-ref debt ledger, EXPECTED red until S13):
#   .\gradlew.bat :common:compileJava -Pip_scc_closed=true --console=plain --no-daemon
# Flipped to true permanently at S13 (SCC closure); property + machinery deleted at S20.
ip_scc_closed=true

# Mod properties
mod_id=seamlessportals
mod_name=Seamless Portals
mod_version=1.0.0
