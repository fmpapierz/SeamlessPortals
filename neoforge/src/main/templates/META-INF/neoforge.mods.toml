license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''

[[mixins]]
config = "seamlessportals-common.mixins.json"

[[mixins]]
config = "seamlessportals-ip-qmisc.mixins.json"

[[mixins]]
config = "seamlessportals-ip-core-common.mixins.json"

[[mixins]]
config = "seamlessportals-ip-client.mixins.json"

# S16 consistency (verify wf_91b049a9-0c1 minor): listed like the other IP configs. NEAR-inert on
# NeoForge — EntityPortalsFlag force-falses off Fabric (S13-B P4), so the plugin skips every
# qouteall.* mixin EXCEPT the two D3 carve-out sets, which bypass the flag and weave here too:
# the worldgen accessors (S19-D; pure @Accessor/@Invoker) and the wand/stick legacy-item datafix
# (S19 commons tail; additive @Inject(RETURN), references only DFU/guava/log4j — audited benign on
# NeoForge, where the peripheral items are C7-deferred; converting the NBT preserves the data for a
# later world move to Fabric). All behavioral qouteall mixins remain skipped; flag-ON NeoForge is C7.
[[mixins]]
config = "seamlessportals-ip-peripheral.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[mixins]]
config = "seamlessportals-ip-dimlib.mixins.json"
