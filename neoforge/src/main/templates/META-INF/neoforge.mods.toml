license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''

[[mixins]]
config = "seamlessportals-common.mixins.json"

[[mixins]]
config = "seamlessportals-ip-qmisc.mixins.json"

[[mixins]]
config = "seamlessportals-ip-core-common.mixins.json"

[[mixins]]
config = "seamlessportals-ip-client.mixins.json"

# S16 consistency (verify wf_91b049a9-0c1 minor): listed like the other IP configs. NEAR-inert on
# NeoForge — SeamlessMixinConfigPlugin's weave gate is isFabricLoaderPresent(), so the plugin skips
# every qouteall.* mixin EXCEPT the two D3 carve-out sets, which bypass that gate and weave here too:
# (S20 increment 4 note: the gate USED to be `isFabricLoaderPresent() && EntityPortalsFlag.isOn()`.
# The flag is deleted; the loader half was always what kept this inert here, and it is now the whole
# gate. Do NOT "simplify" that gate — see the plugin's javadoc.)
# the worldgen accessors (S19-D; pure @Accessor/@Invoker) and the wand/stick legacy-item datafix
# (S19 commons tail; additive @Inject(RETURN), references only DFU/guava/log4j — audited benign on
# NeoForge, where the peripheral items are C7-deferred; converting the NBT preserves the data for a
# later world move to Fabric). All behavioral qouteall mixins remain skipped; flag-ON NeoForge is C7.
[[mixins]]
config = "seamlessportals-ip-peripheral.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[mixins]]
config = "seamlessportals-ip-dimlib.mixins.json"

# C2-0 (migration/C2_DESIGN.md §6.1/§6.3): the real Sodium/Iris compat config. Listed on both
# loaders because it ships in :common. INERT on NeoForge: its IPCompatMixinPlugin gate 2 is
# isFabricLoaderPresent() (S20 increment 4; it was `isFabricLoaderPresent() && EntityPortalsFlag
# .isOn()` until the flag was deleted) — so gate 2 skips EVERY compat class here regardless of
# whether sodium/embeddium/iris are present. No invoker install exists on NeoForge either, so the
# facades no-op. (embeddium is NOT treated as sodium by the plugin — design §6.3.) NeoForge portal
# support is C7.
[[mixins]]
config = "seamlessportals-ip-compat.mixins.json"
