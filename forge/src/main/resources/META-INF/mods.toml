# MinecraftForge mod metadata — 26.3 port addition. Same mod identity as neoforge.mods.toml; Forge's own format:
# `modLoader` / `loaderVersion` are required, dependencies use `mandatory=`, and there is NO [[mixins]] table on Forge —
# the eight mixin configs are declared through the jar manifest (`MixinConfigs`) and dev-run `--mixin.config=` args,
# see forge/build.gradle.
modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''
logoFile="assets/seamlessportals/icon.png"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"